  <g transform="translate(300 300) rotate(0) scale(1) translate(-300 -300)">
    
    <rect x="150" y="176" width="300" height="58" rx="16" fill="url(#body)"/>
    <rect x="150" y="248" width="300" height="58" rx="16" fill="#334155" opacity="0.82"/>
    <rect x="150" y="320" width="300" height="58" rx="16" fill="url(#body)"/>
    <rect x="150" y="392" width="300" height="58" rx="16" fill="#334155" opacity="0.82"/>
    <rect x="176" y="196" width="120" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
    <rect x="176" y="340" width="120" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
  </g>

  <text x="300" y="546" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">Salon Cotton Towels</text>
