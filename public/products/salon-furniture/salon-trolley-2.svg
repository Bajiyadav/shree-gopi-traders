<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Salon Trolley — Salon Furniture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eceef0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71717a"/><stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71717a"/><stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect y="470" width="600" height="130" fill="#f6f7f8"/>
  <ellipse cx="300" cy="486" rx="168" ry="30" fill="url(#shadow)"/>

  <g transform="translate(292 300) rotate(-7) scale(0.9) translate(-300 -300)">
    
    <rect x="168" y="152" width="264" height="24" rx="10" fill="url(#body)"/>
    <rect x="168" y="248" width="264" height="24" rx="10" fill="url(#body)"/>
    <rect x="168" y="344" width="264" height="24" rx="10" fill="url(#body)"/>
    <rect x="186" y="152" width="16" height="240" rx="6" fill="#1e293b" opacity="0.75"/>
    <rect x="398" y="152" width="16" height="240" rx="6" fill="#1e293b" opacity="0.75"/>
    <rect x="200" y="176" width="200" height="60" rx="8" fill="#ffffff" opacity="0.55"/>
    <rect x="200" y="272" width="200" height="60" rx="8" fill="#ffffff" opacity="0.45"/>
    <circle cx="204" cy="424" r="26" fill="#0f172a"/><circle cx="204" cy="424" r="11" fill="#71717a"/>
    <circle cx="396" cy="424" r="26" fill="#0f172a"/><circle cx="396" cy="424" r="11" fill="#71717a"/>
  </g>

  <text x="300" y="546" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">Salon Trolley</text>

  <g id="sgt-brand-tag" transform="translate(415, 20)">
    <rect x="0" y="0" width="165" height="46" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="20" cy="23" r="5" fill="#f59e0b"/>
    <text x="34" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">SGT ORIGINAL</text>
