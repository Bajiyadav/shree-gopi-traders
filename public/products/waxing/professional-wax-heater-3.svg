<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Professional Wax Heater — Waxing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eceef0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect y="470" width="600" height="130" fill="#f6f7f8"/>
  <ellipse cx="300" cy="486" rx="168" ry="30" fill="url(#shadow)"/>

  <g transform="translate(310 300) rotate(6) scale(0.94) translate(-300 -300)">
    
    <rect x="176" y="130" width="248" height="180" rx="22" fill="url(#body)"/>
    <rect x="200" y="156" width="200" height="112" rx="12" fill="#ffffff" opacity="0.22"/>
    <circle cx="250" cy="212" r="24" fill="#eab308" opacity="0.9"/>
    <rect x="292" y="196" width="92" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
    <rect x="292" y="220" width="64" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
    <rect x="284" y="310" width="32" height="112" rx="10" fill="#0f172a"/>
    <ellipse cx="300" cy="440" rx="106" ry="26" fill="#0f172a" opacity="0.85"/>
    <ellipse cx="300" cy="432" rx="106" ry="26" fill="#1e293b"/>
  </g>

  <text x="300" y="546" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">Professional Wax Heater</text>

  <g id="sgt-brand-tag" transform="translate(415, 20)">
    <rect x="0" y="0" width="165" height="46" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="20" cy="23" r="5" fill="#f59e0b"/>
    <text x="34" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">SGT ORIGINAL</text>
  </g>
